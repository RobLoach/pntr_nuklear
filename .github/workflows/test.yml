name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            examples: ON
          - os: macos-latest
            examples: ON
          - os: windows-latest
            examples: OFF
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DPNTR_NUKLEAR_BUILD_EXAMPLES=${{ matrix.examples }} -DPNTR_NUKLEAR_BUILD_EXAMPLES_RAYLIB=OFF

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure
